name: Prepare DEV9 public hotfix

on:
  push:
    branches:
      - release/publish-dev9-and-correct-public-baseline
    paths:
      - fair-raps-researcher-toolkit_5_9_0-dev9.html
      - .github/workflows/prepare-dev9-public-hotfix.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: release/publish-dev9-and-correct-public-baseline
          fetch-depth: 0

      - name: Verify locked DEV9 and generate bounded public correction
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="3bc3d31600eaccfd37d5a11e171a9276ab0973f57e5608b8aff377b6778a0001"
          SOURCE="fair-raps-researcher-toolkit_5_9_0-dev9.html"
          HOTFIX="fair-raps-researcher-toolkit_5_9_0-dev9-public-hotfix1.html"
          ACTUAL="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("fair-raps-researcher-toolkit_5_9_0-dev9.html")
          output_path = Path("fair-raps-researcher-toolkit_5_9_0-dev9-public-hotfix1.html")
          text = source_path.read_text(encoding="utf-8")

          replacements = [
              ("<title>TU/e FAIR Data Clinic Toolkit v5.9.0-dev9</title>",
               "<title>TU/e FAIR Data Clinic Toolkit v5.9.0-dev9-public-hotfix1</title>"),
              ("<meta content=\"Version 5.9.0-dev9 of the TU/e FAIR Data Clinic Toolkit.",
               "<meta content=\"Version 5.9.0-dev9-public-hotfix1 of the TU/e FAIR Data Clinic Toolkit."),
              ("META.version='5.9.0-dev9';",
               "META.version='5.9.0-dev9-public-hotfix1';"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Unexpected occurrence count for: {old[:60]}")
              text = text.replace(old, new, 1)

          directory_pattern = re.compile(r"const DS_BY_DEPARTMENT=\[.*?\];const DEPARTMENT_TYPES=", re.S)
          text, count = directory_pattern.subn("const DS_BY_DEPARTMENT=[];const DEPARTMENT_TYPES=", text, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one embedded Data Steward directory")

          test_pattern = re.compile(
              r"add\('Departmental routing resolves Mechanical Engineering'.*?(?=add\('Institutional home exposes both role entry paths')",
              re.S,
          )
          replacement_tests = (
              "add('No departmental personnel directory is embedded',()=>DS_BY_DEPARTMENT.length===0);"
              "add('Central RDM support route remains available',()=>DS_GENERAL_EMAIL==='rdmsupport@tue.nl');"
              "add('New drafts do not inherit a prior manual Data Steward assignment',()=>{const c=defaults();c.researcher.assignedSteward='Assigned steward';c.researcher.stewardAssignment={...emptyStewardAssignment(),stewardName:'Assigned steward',stewardEmail:'steward@example.org',assignmentMethod:'researcher-selected-manual',assignedAt:new Date().toISOString()};const n=deriveNewDraft(c);return!n.researcher.assignedSteward&&!n.researcher.stewardAssignment.assignedAt});"
              "add('Structured manual assignment survives case migration',()=>{const c=defaults(),at=new Date().toISOString();c.researcher.department='External institution';c.researcher.departmentType='external';c.researcher.assignedSteward='Assigned steward';c.researcher.stewardAssignment={department:'External institution',directoryDepartment:'',stewardName:'Assigned steward',stewardEmail:'steward@example.org',directorySource:'',directoryCheckedAt:'',assignmentMethod:'researcher-selected-manual',assignedAt:at,assignedByRole:'researcher'};const m=migrateCase(c);return m.researcher.stewardAssignment.stewardEmail==='steward@example.org'});"
          )
          text, count = test_pattern.subn(replacement_tests, text, count=1)
          if count != 1:
              raise SystemExit("Expected one legacy departmental-routing self-test block")

          if text.count("const DS_BY_DEPARTMENT=[];const DEPARTMENT_TYPES=") != 1:
              raise SystemExit("Corrected derivative does not contain exactly one empty departmental directory")

          prohibited_emails = [
              "n.sunami@tue.nl",
              "n.norouzi1@tue.nl",
              "g.patil@tue.nl",
              "a.aleksovska@tue.nl",
              "j.gerona@tue.nl",
              "h.r.nair@tue.nl",
              "d.nardi@tue.nl",
              "r.dennis@tue.nl",
          ]
          remaining = [value for value in prohibited_emails if value in text]
          if remaining:
              raise SystemExit(f"Individual Data Steward email addresses remain in corrected derivative: {remaining}")

          output_path.write_text(text, encoding="utf-8", newline="\n")
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("fair-raps-researcher-toolkit_5_9_0-dev9-public-hotfix1.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", html, flags=re.S | re.I)
          if not blocks:
              raise SystemExit("No executable script block found")
          Path("/tmp/dev9-public-hotfix.js").write_text("\n".join(blocks), encoding="utf-8")
          PY
          node --check /tmp/dev9-public-hotfix.js

          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = [
              "fair-raps-researcher-toolkit_5_8_0-rc15.html",
              "fair-raps-researcher-toolkit_5_9_0-dev9.html",
              "fair-raps-researcher-toolkit_5_9_0-dev9-public-hotfix1.html",
          ]
          lines = []
          for name in files:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f"Missing public artifact: {name}")
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          grep -F "3bc3d31600eaccfd37d5a11e171a9276ab0973f57e5608b8aff377b6778a0001  fair-raps-researcher-toolkit_5_9_0-dev9.html" SHA256SUMS.txt
          sha256sum "$HOTFIX"

      - name: Commit generated correction and checksums
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fair-raps-researcher-toolkit_5_9_0-dev9-public-hotfix1.html SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Publish bounded DEV9 public personnel-directory hotfix"
          git push origin HEAD:release/publish-dev9-and-correct-public-baseline
